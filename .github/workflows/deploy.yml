name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup-build-deploy:
    name: "빌드 - 배포"
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: 'logging'
        run: |
          node -v
          pnpm -v
