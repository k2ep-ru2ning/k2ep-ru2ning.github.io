name: Deploy

on:
  push:
    branches:
      - main
      - feat/github-actions-deploy

jobs:
  setup-build-deploy:
    name: "빌드 - 배포"
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build then deploy
        run: pnpm deploy
